<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlast - Discover Your Next Adventure</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <!-- ==================== NAVBAR ==================== -->
    <header class="header">
        <nav class="navbar container">
            <!-- Left Menu -->
            <ul class="nav-menu nav-left">
                <li><a href="#" class="nav-link active">Home</a></li>
                <li><a href="#" class="nav-link">Destinations</a></li>
                <li><a href="#" class="nav-link">My Bookings</a></li>
                <li><a href="#" class="nav-link">Admin</a></li>
            </ul>
            
            <!-- Center Logo -->
            <div class="logo">
                <a href="#">Wander<span class="logo-accent">last</span></a>
            </div>
            
            <!-- Right Menu -->
            <ul class="nav-menu nav-right">
                <li>
                    <a href="#" class="nav-link profile-link">
                        <i class="fa-regular fa-user"></i> Profile
                    </a>
                </li>
                <li><a href="#" class="nav-link">Login</a></li>
                <li><a href="#" class="nav-link">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- ==================== HERO SECTION ==================== -->
    <section class="hero">
        <div class="hero-overlay"></div>
        
        <div class="hero-content container">
            <h1 class="hero-title">
                Discover Your <br>
                Next <br>
                Adventure
            </h1>
            
            <p class="hero-subtitle">
                Explore breathtaking destinations and create unforgettable memories with our curated travel experiences.
            </p>
        </div>
        
        <!-- Search Bar -->
        <div class="search-bar container">
            <div class="search-item">
                <label>Location</label>
                <input type="text" placeholder="Address, City Or Zip">
            </div>
            
            <div class="search-item">
                <label>Date/duration</label>
                <input type="text" placeholder="Anytime/3 Days">
            </div>
            
            <div class="search-item">
                <button class="btn-explore">
                    EXPLORE NOW <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
            <div class="search-item">
                <button class="btn-view">
                    VIEW DESTINATION
                </button>
            </div>
            
            <div class="search-item">
                <label>People</label>
                <input type="text" placeholder="5-10">
            </div>
            
            <button class="btn-search">
                Search
            </button>
        </div>
    </section>

</body>
</html>
